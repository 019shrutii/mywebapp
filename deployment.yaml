apiVersion: apps/v1
kind: Deployment

metadata:
  name: mywebapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mywebapp

  template:
    metadata:
      labels:
        app: mywebapp

    spec:
      containers:
      - name: mywebapp

        image: shruti019/mywebapp:latest

        ports:
        - containerPort: 80